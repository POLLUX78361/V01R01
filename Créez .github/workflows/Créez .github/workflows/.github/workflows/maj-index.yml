name: Mise à jour index généalogique

on:
  push:
    paths:
      - "famille.json"

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Génération index
        run: node generate-index.js

      - name: Commit index.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add index.json
          git add index-patronymes.json

          git diff --cached --quiet || git commit -m "Mise à jour automatique des index"

          git push
