name: Mise à jour généalogie

on:
  push:
    paths:
      - "famille.ged"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conversion GEDCOM vers JSON
        run: node convert-gedcom.js

      - name: Génération des index
        run: node generate-index.js

      - name: Commit automatique
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add famille.json
          git add index.json
          git add index-patronymes.json

          git diff --cached --quiet || git commit -m "Mise à jour automatique généalogie"

          git push
