<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
}

header h1{
    margin:0;
    font-size:3.2em;
}

header p{
    font-size:1.25em;
}

#tree{
    width:100%;
    height:900px;
}

/* SUPPRESSION DE LA RECHERCHE FAMILYTREE */

.bft-search,
.bft-search-container,
.bft-search-box,
.bft-search-result,
.bft-search-results,
[data-search]{
    display:none !important;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>
</head>

<body>

<header>
<h1>Arbre généalogique</h1>
<p>Famille ANDREY de la Suisse vers la France</p>
</header>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY - Site généalogique familial
</footer>

<script>

fetch("famille.json")
.then(response => response.json())
.then(data => {

    const nodes = data.map(p => ({

        id: p.id,

        fid: p.fid && p.fid !== "null"
            ? p.fid
            : undefined,

        mid: p.mid && p.mid !== "null"
            ? p.mid
            : undefined,

        name: p.nom,

        title:
            (p.naissance || "") +
            (p.deces ? " - " + p.deces : "")

    }));


    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            scaleInitial: FamilyTree.match.boundary

        }
    );

    tree.load(nodes);

})
.catch(error => {

    document.getElementById("tree").innerHTML =
        "<div style='padding:30px;color:red;text-align:center'>" +
        error.message +
        "</div>";

    console.error(error);

});

</script>

</body>
</html>
