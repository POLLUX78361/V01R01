<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:3.2em;
}

header p{
    font-size:1.25em;
}

nav{
    background:#3b2618;
    padding:12px;
    overflow-x:auto;
    white-space:nowrap;
    text-align:center;
}

nav a{
    color:#f7f2e8;
    text-decoration:none;
    margin:0 8px;
    font-weight:bold;
}

nav a:hover{
    color:#d4af37;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#resultats{
    max-width:700px;
    margin:10px auto;
    padding:10px;
    border:1px solid #d4af37;
    border-radius:8px;
    background:#fff8e7;
    display:none;
}

.resultat-personne{
    padding:8px;
    margin:5px 0;
    cursor:pointer;
    border-radius:4px;
    color:#004a99;
    font-weight:bold;
}

.resultat-personne:hover{
    background:#f1f1f1;
    text-decoration:underline;
}

#tree{
    width:100%;
    height:900px;
    border-top:4px solid #d4af37;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>

</head>

<body>

<header>
<h1>Arbre généalogique</h1>
<p>Famille ANDREY de la Suisse vers la France</p>
</header>

<nav>
<a href="index.html">Accueil</a>
<a href="ancetres.html">Ancêtres</a>
<a href="arbre.html">Arbre</a>
<a href="armoiries.html">Armoiries</a>
<a href="chronologie.html">Chronologie</a>
<a href="contact.html">Contact</a>
<a href="documents.html">Documents</a>
<a href="photos.html">Photos</a>
<a href="localisation.html">Localisation</a>
<a href="patronyme.html">Patronyme</a>
<a href="sources.html">Sources</a>
</nav>

<div class="search-box">
<input
id="search"
type="text"
placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="resultats"></div>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY - Site généalogique familial
</footer>

<script>

fetch("famille.json")
.then(response => {

    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }

    return response.json();

})
.then(data => {

    const nodes = data.map(personne => ({

        id: personne.id,
        fid: personne.fid || undefined,
        mid: personne.mid || undefined,

        name: personne.nom,

        naissance: personne.naissance || "",
        deces: personne.deces || "",

        title:
            (personne.naissance || "") +
            (personne.deces
                ? " - " + personne.deces
                : "")

    }));

    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            scaleInitial:
                FamilyTree.match.boundary

        }
    );

    tree.load(nodes);

    setTimeout(() => {
        tree.fit();
    }, 500);


    function normaliser(txt) {

        return (txt || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    }


    function focusPersonne(id) {

        try {

            tree.center(id);
            tree.select(id);

        } catch (e) {}

        const noeud =
            document.querySelector(
                '[data-n-id="' + id + '"]'
            );

        if (!noeud) return;

        noeud.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "center"
        });

        const cadre =
            noeud.querySelector("rect");

        if (!cadre) return;

        const ancienStroke =
            cadre.getAttribute("stroke");

        const ancienWidth =
            cadre.getAttribute("stroke-width");

        cadre.setAttribute(
            "stroke",
            "#d4af37"
        );

        cadre.setAttribute(
            "stroke-width",
            "5"
        );

        setTimeout(() => {

            cadre.setAttribute(
                "stroke",
                ancienStroke || "#aeaeae"
            );

            cadre.setAttribute(
                "stroke-width",
                ancienWidth || "1"
            );

        }, 3000);

    }


    function afficherRattachement(personne) {

        let fiche =
            document.getElementById(
                "fiche-personne"
            );

        if (!fiche) {

            fiche =
                document.createElement("div");

            fiche.id =
                "fiche-personne";

            fiche.style.maxWidth =
                "700px";

            fiche.style.margin =
                "20px auto";

            fiche.style.padding =
                "15px";

            fiche.style.border =
                "1px solid #d4af37";

            fiche.style.borderRadius =
                "8px";

            fiche.style.background =
                "#fff8e7";

            document
                .getElementById("tree")
                .before(fiche);

        }

        const pere =
            data.find(
                p => p.id == personne.fid
            );

        const mere =
            data.find(
                p => p.id == personne.mid
            );

        const enfants =
            data.filter(
                p =>
                    p.fid == personne.id ||
                    p.mid == personne.id
            );

        const urlDirecte =
            window.location.origin +
            window.location.pathname +
            "?id=" +
            personne.id;

        let html = `
            <h2>${personne.nom}</h2>

            <p>
            <strong>Naissance :</strong>
            ${personne.naissance || "Inconnue"}
            </p>

            <p>
            <strong>Décès :</strong>
            ${personne.deces || "Inconnu"}
            </p>
        `;

        if (pere) {

            html += `
                <p>
                <strong>Père :</strong>
                ${pere.nom}
                </p>
            `;

        }

        if (mere) {

            html += `
                <p>
                <strong>Mère :</strong>
                ${mere.nom}
                </p>
            `;

        }

        if (enfants.length > 0) {

            html +=
                "<p><strong>Enfants :</strong></p><ul>";

            enfants.forEach(enfant => {

                html +=
                    "<li>" +
                    enfant.nom +
                    "</li>";

            });

            html += "</ul>";

        }

        html += `
            <hr>

            <p>
            <strong>Lien direct :</strong>
            </p>

            <input
                type="text"
                value="${urlDirecte}"
                readonly
                style="
                    width:100%;
                    padding:8px;
                    box-sizing:border-box;
                "
                onclick="this.select()"
            >
        `;

        fiche.innerHTML = html;

    }



    const zone =
        document.getElementById(
            "resultats"
        );



    document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const recherche =
                normaliser(
                    this.value.trim()
                );

            zone.innerHTML = "";
            zone.style.display = "none";

            if (!recherche) {
                return;
            }

            const resultat =
                data.filter(personne =>
                    normaliser(
                        personne.nom
                    ).includes(
                        recherche
                    )
                );

            zone.style.display =
                "block";

            if (
                resultat.length === 0
            ) {

                zone.innerHTML =
                    "<strong>Aucun résultat trouvé</strong>";

                return;

            }

            zone.innerHTML =
                "<strong>" +
                resultat.length +
                " résultat(s)</strong><br><br>";

            resultat.forEach(personne => {

                const ligne =
                    document.createElement(
                        "div"
                    );

                ligne.className =
                    "resultat-personne";

                ligne.textContent =
                    personne.nom;

                ligne.onclick =
                    function () {

                        zone.style.display =
                            "none";

                        focusPersonne(
                            personne.id
                        );

                        afficherRattachement(
                            personne
                        );

                        history.replaceState(
                            null,
                            null,
                            "?id=" +
                            personne.id
                        );

                    };

                zone.appendChild(
                    ligne
                );

            });

        }
    );



    const params =
        new URLSearchParams(
            window.location.search
        );

    const personneId =
        params.get("id");

    if (personneId) {

        const personne =
            data.find(
                p =>
                p.id == personneId
            );

        if (personne) {

            setTimeout(() => {

                focusPersonne(
                    personne.id
                );

                afficherRattachement(
                    personne
                );

            }, 800);

        }

    }

})
.catch(error => {

    console.error(error);

    document
    .getElementById("tree")
    .innerHTML =
        "<div style='padding:30px;text-align:center;color:red'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
