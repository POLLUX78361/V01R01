<footer>

© 2025-2026 Famille ANDREY - Site généalogique familial

</footer>

<script>

function nettoyerPersonne(p){

    if(!p.birthYear){
        return null;
    }

    if(p.birthYear > 1926){
        return null;
    }

    if(p.deathYear){

        if(
            p.deathYear < 1000 ||
            p.deathYear > 2026
        ){
            p.deathYear = null;
        }
    }

    let titre = "";

    if(p.birthYear){
        titre += p.birthYear;
    }

    if(p.deathYear){
        titre += " - " + p.deathYear;
    }

    return {

        id:p.id,

        fid:p.fid || null,

        mid:p.mid || null,

        name:p.name,

        title:titre

    };
}

fetch("famille.json")

.then(response => response.json())

.then(data => {

    data = data
        .map(nettoyerPersonne)
        .filter(Boolean);

    const tree =
        new FamilyTree(
            document.getElementById("tree"),
            {

                enableSearch:true,

                nodeBinding:{

                    field_0:"name",

                    field_1:"title"

                },

                toolbar:{

                    zoom:true,

                    fit:true,

                    expandAll:true

                },

                nodeMenu:{},

                menu:{},

                editForm:{
                    readOnly:true
                },

                scaleInitial:
                    FamilyTree.match.boundary
            }
        );

    tree.load(data);

    document
    .getElementById("search")
    .addEventListener(
        "keyup",
        function(){

            tree.search(
                this.value
            );

        }
    );

});

window.addEventListener(
    "keydown",
    function(e){

        if(e.ctrlKey){

            const k =
                e.key.toLowerCase();

            if(
                k==="s" ||
                k==="p"
            ){

                e.preventDefault();
            }
        }
    }
);

window.oncontextmenu =
    function(){
        return false;
    };

</script>
