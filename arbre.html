<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#resultats{
    max-width:700px;
    margin:10px auto;
    padding:10px;
    display:none;
    background:#fff8e7;
    border:1px solid #d4af37;
    border-radius:8px;
}

#tree{
    width:100%;
    height:900px;
}

</style>

</head>

<body>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="resultats"></div>

<div id="tree"></div>

<script>

fetch("famille.json")
.then(response => {
    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }
    return response.json();
})
.then(data => {

    const nodes = data.map(p => ({
        id: p.id,
        fid: p.fid && p.fid !== "null" ? p.fid : undefined,
        mid: p.mid && p.mid !== "null" ? p.mid : undefined,
        name: p.nom,
        titre:
            (p.naissance || "") +
            (p.deces ? " - " + p.deces : "")
    }));


    const arbre = new FamilyTree(
        document.getElementById("tree"),
        {
            nodeBinding: {
                field_0: "name",
                field_1: "titre"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            searchFields: [],
            enableSearch: false,
            showSearch: false
        }
    );

    arbre.load(nodes);


    let zoneResultats =
        document.getElementById("resultats");

    if (!zoneResultats) {

        zoneResultats =
            document.createElement("div");

        zoneResultats.id = "resultats";

        zoneResultats.style.maxWidth = "700px";
        zoneResultats.style.margin = "10px auto";
        zoneResultats.style.padding = "10px";
        zoneResultats.style.background = "#fff8e7";
        zoneResultats.style.border = "1px solid #d4af37";
        zoneResultats.style.borderRadius = "8px";
        zoneResultats.style.display = "none";

        document
            .querySelector(".search-box")
            .after(zoneResultats);
    }


    function normaliser(texte) {

        return (texte || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    }


    document.getElementById("search")
    .addEventListener("input", function() {

        zoneResultats.innerHTML = "";
        zoneResultats.style.display = "none";

        const recherche =
            normaliser(this.value.trim());

        if (!recherche) {
            return;
        }

        const resultats = nodes.filter(personne =>
            normaliser(personne.name)
                .includes(recherche)
        );

        zoneResultats.style.display = "block";

        if (resultats.length === 0) {

            zoneResultats.innerHTML =
                "Aucun résultat trouvé";

            return;
        }

        zoneResultats.innerHTML =
            "<strong>" +
            resultats.length +
            " résultat(s) trouvé(s)</strong><br><br>";

        resultats.forEach(personne => {

            zoneResultats.innerHTML +=
                "• " +
                personne.name +
                "<br>";

        });

    });

})
.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:20px;color:red'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
