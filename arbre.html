<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
}

header h1{
    margin:0;
    font-size:3em;
}

#tree{
    width:100%;
    height:900px;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:20px;
}

.bft-search,
.bft-search-container,
.bft-search-box,
.bft-search-result,
.bft-search-results{
    display:none !important;
}

</style>

</head>

<body>

<header>
    <h1>Arbre généalogique</h1>
    <p>Famille ANDREY de la Suisse vers la France</p>
</header>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY
</footer>

<script>

fetch("famille.json")
.then(response => response.json())
.then(data => {

    const nodes = data.map(personne => ({

        id: personne.id,

        fid: personne.fid || undefined,

        mid: personne.mid || undefined,

        name: personne.nom,

        title:
            (personne.naissance || "") +
            (personne.deces ? " - " + personne.deces : "")

    }));


    var tree = new FamilyTree(
        document.getElementById("tree"),
        {

            scaleInitial: FamilyTree.match.boundary,

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            }

        }
    );

    tree.load(nodes);

    tree.fit();

})
.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:30px;color:red;text-align:center'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
