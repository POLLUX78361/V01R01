<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:3.2em;
}

header p{
    font-size:1.25em;
}

nav{
    background:#3b2618;
    padding:12px;
    overflow-x:auto;
    white-space:nowrap;
    text-align:center;
}

nav a{
    color:#f7f2e8;
    text-decoration:none;
    margin:0 8px;
    font-weight:bold;
}

nav a:hover{
    color:#d4af37;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}


}
#tree{
    width:100%;
    height:900px;
    border-top:4px solid #d4af37;
}

#fiche-personne{
    position:fixed;
    top:140px;
    left:50%;
    transform:translateX(-50%);
    width:350px;
    max-height:80vh;
    overflow-y:auto;
    text-align:left;
    background:#fffdf8ee;
    backdrop-filter:blur(4px);
    border:2px solid #d4af37;
    border-radius:10px;
    padding:12px;
    box-shadow:0 0 15px rgba(0,0,0,.20);
    z-index:9999;
    font-size:14px;
    opacity:0.95;
}

  #fermer-fiche{
    position:fixed;
    top:145px;
    left:calc(50% + 185px);
    z-index:10000;
    background:#d4af37;
    color:#2c1810;
    border:none;
    border-radius:5px;
    padding:6px 10px;
    cursor:pointer;
    font-weight:bold;
}

#fiche-personne h2{
    margin-top:0;
    color:#3b2618;
    font-size:30px;
    line-height:1.1;
}


#fiche-personne h3{
    color:#5a3e2b;
    margin-top:15px;
    border-bottom:1px solid #d4af37;
    padding-bottom:5px;
}

#fiche-personne ul{
    padding-left:20px;
}

#fiche-personne li{
    margin-bottom:5px;
}

#fiche-personne input{
    width:100%;
    padding:8px;
    border:1px solid #d4af37;
    border-radius:4px;
    box-sizing:border-box;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>

</head>

<body>

<header>
<h1>Arbre généalogique</h1>
<p>Famille ANDREY de la Suisse vers la France</p>
</header>

<nav>
<a href="index.html">Accueil</a>
<a href="ancetres.html">Ancêtres</a>
<a href="arbre.html">Arbre</a>
<a href="armoiries.html">Armoiries</a>
<a href="chronologie.html">Chronologie</a>
<a href="contact.html">Contact</a>
<a href="documents.html">Documents</a>
<a href="photos.html">Photos</a>
<a href="localisation.html">Localisation</a>
<a href="patronyme.html">Patronyme</a>
<a href="sources.html">Sources</a>
</nav>

<div class="search-box">
<input
id="search"
type="text"
placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="tree"></div>

<div id="fiche-personne"></div>    
<button id="fermer-fiche">✖</button>
    
<footer>
© 2026 Famille ANDREY - Site généalogique familial
</footer>

<script>

fetch("famille.json")
.then(response => {

    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }

    return response.json();

})
.then(data => {

    const nodes = data.map(personne => ({

        id: personne.id,
        fid: personne.fid || undefined,
        mid: personne.mid || undefined,

        name: personne.nom,

        naissance: personne.naissance || "",
        deces: personne.deces || "",

        title:
            (personne.naissance || "") +
            (personne.deces
                ? " - " + personne.deces
                : "")

    }));

    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            scaleInitial:
                FamilyTree.match.boundary

        }
    );

    tree.load(nodes);

    setTimeout(() => {
        tree.fit();
    }, 500);


    function normaliser(txt) {

        return (txt || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    }


    function focusPersonne(id) {

        try {

            tree.center(id);
            tree.select(id);

        } catch (e) {}

        const noeud =
            document.querySelector(
                '[data-n-id="' + id + '"]'
            );

        if (!noeud) return;

        noeud.scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "center"
        });

        const cadre =
            noeud.querySelector("rect");

        if (!cadre) return;

        const ancienStroke =
            cadre.getAttribute("stroke");

        const ancienWidth =
            cadre.getAttribute("stroke-width");

        cadre.setAttribute(
            "stroke",
            "#d4af37"
        );

        cadre.setAttribute(
            "stroke-width",
            "5"
        );

        setTimeout(() => {

            cadre.setAttribute(
                "stroke",
                ancienStroke || "#aeaeae"
            );

            cadre.setAttribute(
                "stroke-width",
                ancienWidth || "1"
            );

        }, 3000);

    }


function afficherRattachement(personne) {

  const fiche =
    document.getElementById(
        "fiche-personne"
    );

fiche.style.display = "block";
    const pere =
    personne.fid
    ? data.find(
        p => p.id === personne.fid
      )
    : null;
   
const mere =
    personne.mid
    ? data.find(
        p => p.id === personne.mid
      )
    : null;
        
    
const fratrie =
    data.filter(
        p =>
            p.id !== personne.id &&
            personne.fid &&
            personne.mid &&
            p.fid === personne.fid &&
            p.mid === personne.mid
    );
 

    const enfants =
        data.filter(
            p =>
                p.fid == personne.id ||
                p.mid == personne.id
        );

    const urlDirecte =
        window.location.origin +
        window.location.pathname +
        "?id=" +
        personne.id;

    let html = `
        <h2>${personne.nom}</h2>

        <p>
        <strong>Naissance :</strong>
        ${personne.naissance || "Inconnue"}
        </p>

        <p>
        <strong>Décès :</strong>
        ${personne.deces || "Inconnu"}
        </p>
    `;

    if(pere || mere){

        html +=
        "<h3>Parents</h3>";
    }

    if(pere){

        html += `
        <p>
        <a href="?id=${pere.id}">
        👨 ${pere.nom}
        </a> 
        </p>
        `;
    }

    if(mere){

        html += `
        <p>
       <a href="?id=${mere.id}">
       👩 ${mere.nom}
        </a>
        </p>
        `;
    }

if(fratrie.length){

    html +=
    "<h3>Frères et sœurs</h3><ul>";

    fratrie.forEach(f => {

        html +=
        '<li><a href="?id=' +
        f.id +
        '">' +
        f.nom +
        '</a></li>';

    });

    html +=
    "</ul>";
}

if(enfants.length){

    html +=
    "<h3>Enfants</h3><ul>";

    enfants.forEach(e => {

        html +=
        '<li><a href="?id=' +
        e.id +
        '">' +
        e.nom +
        '</a></li>';

    });

    html +=
    "</ul>";
}

    html += `
        <hr>

        <strong>
        Lien direct
        </strong>

        <br><br>

        <input
            type="text"
            readonly
            value="${urlDirecte}"
            onclick="this.select();">
    `;

    fiche.innerHTML =
        html;

}


document
    .getElementById("search")
    .addEventListener(
        "input",
        function () {

            const recherche =
                normaliser(
                    this.value.trim()
                );

            if (!recherche) {
                return;
            }

            const resultat =
                data.filter(personne =>
                    normaliser(
                        personne.nom
                    ).includes(
                        recherche
                    )
                );

            if (resultat.length === 0) {
                return;
            }

            focusPersonne(
                resultat[0].id
            );

            afficherRattachement(
                resultat[0]
            );

            history.replaceState(
                null,
                null,
                "?id=" + resultat[0].id
            );

        }
    );
  
      

    const params =
        new URLSearchParams(
            window.location.search
        );

    document
.getElementById("fermer-fiche")
.addEventListener(
    "click",
    function(){

  document
.getElementById(
    "fiche-personne"
)
.style.display = "none";      

    }
);  
    const personneId =
        params.get("id");

    if (personneId) {

        const personne =
            data.find(
                p =>
                p.id == personneId
            );

        if (personne) {

            setTimeout(() => {

                focusPersonne(
                    personne.id
                );

                afficherRattachement(
                    personne
                );

            }, 800);

        }

    }

})
.catch(error => {

    console.error(error);

    document
    .getElementById("tree")
    .innerHTML =
        "<div style='padding:30px;text-align:center;color:red'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
