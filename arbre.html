<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia, serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:3.2em;
}

header p{
    font-size:1.25em;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#resultats{
    max-width:700px;
    margin:10px auto;
    padding:10px;
    background:#fff8e7;
    border:1px solid #d4af37;
    border-radius:8px;
    display:none;
}

#tree{
    width:100%;
    height:900px;
    border-top:4px solid #d4af37;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>

</head>

<body>

<header>
    <h1>Arbre généalogique</h1>
    <p>Famille ANDREY de la Suisse vers la France</p>
</header>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="resultats"></div>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY
</footer>

<script>

fetch("famille.json")
.then(response => {

    if(!response.ok){
        throw new Error("Impossible de charger famille.json");
    }

    return response.json();

})
.then(data => {

    const nodes = data.map(p => ({

        id: p.id,

        fid: p.fid && p.fid !== "null"
            ? p.fid
            : undefined,

        mid: p.mid && p.mid !== "null"
            ? p.mid
            : undefined,

        name: p.nom,

        title:
            (p.naissance || "") +
            (p.deces ? " - " + p.deces : "")

    }));


    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            scaleInitial: FamilyTree.match.boundary

        }
    );

    tree.load(nodes);


    const zone =
        document.getElementById("resultats");


    function normaliser(txt){

        return (txt || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");

    }


    document
    .getElementById("search")
    .addEventListener("input", function(){

        const recherche =
            normaliser(this.value.trim());

        zone.innerHTML = "";
        zone.style.display = "none";

        if(!recherche){
            return;
        }

        const resultat =
            nodes.filter(personne =>
                normaliser(personne.name)
                .includes(recherche)
            );

        zone.style.display = "block";

        if(resultat.length === 0){

            zone.innerHTML =
                "<strong>Aucun résultat trouvé</strong>";

            return;

        }

        zone.innerHTML =
            "<strong>" +
            resultat.length +
            " résultat(s) trouvé(s)</strong><br><br>";

        resultat.forEach(personne => {

            zone.innerHTML +=
                "• " +
                personne.name +
                "<br>";

        });

    });

})
.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:30px;color:red;text-align:center'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
