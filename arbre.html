<div class="search-box">

<input
id="search"
type="text"
placeholder="🔍 Rechercher un nom ou prénom...">

</div>

<div id="tree"></div>

<footer>

© 2025-2026 Famille ANDREY - Site généalogique familial

</footer>

<script>

function nettoyerPersonne(p){

    if(!p.name){
        return null;
    }

    if(
        p.birthYear &&
        p.birthYear > 1926
    ){
        return null;
    }

    let titre = "";

    if(p.birthYear){
        titre += p.birthYear;
    }

    if(p.deathYear){

        if(
            p.deathYear > 1000 &&
            p.deathYear <= 2026
        ){
            titre += " - " + p.deathYear;
        }
    }

    return {

        id:p.id,

        fid:p.fid || null,

        mid:p.mid || null,

        name:p.name,

        title:titre

    };
}

fetch("famille.json")

.then(response => response.json())

.then(data => {

    data = data
        .map(nettoyerPersonne)
        .filter(Boolean);

    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            enableSearch:false,

            nodeBinding:{
                field_0:"name",
                field_1:"title"
            },

            toolbar:{
                zoom:true,
                fit:true,
                expandAll:true
            },

            nodeMenu:{},

            menu:{},

            editForm:{
                readOnly:true
            },

            scaleInitial:
                FamilyTree.match.boundary

        }
    );

    tree.load(data);

    document
    .getElementById("search")
    .addEventListener("input", function(){

        const texte =
            this.value
            .trim()
            .toLowerCase();

        if(texte === ""){
            tree.clearSearch();
            return;
        }

        const resultats =
            data.filter(personne =>
                personne.name
                .toLowerCase()
                .includes(texte)
            );

        if(resultats.length > 0){

            tree.selectNode(
                resultats[0].id
            );

            tree.center(
                resultats[0].id
            );
        }

    });

})

.catch(error => {

    console.error(
        "Erreur chargement JSON :",
        error
    );

});

window.addEventListener(
    "keydown",
    function(e){

        if(e.ctrlKey){

            const touche =
                e.key.toLowerCase();

            if(
                touche === "s" ||
                touche === "p"
            ){
                e.preventDefault();
            }
        }
    }
);

window.oncontextmenu =
    function(){
        return false;
    };

</script>

</body>
