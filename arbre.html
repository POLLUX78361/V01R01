<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
}

nav{
    background:#3b2618;
    padding:12px;
    text-align:center;
}

nav a{
    color:#f7f2e8;
    text-decoration:none;
    margin:0 8px;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#resultats{
    max-width:700px;
    margin:10px auto;
    padding:10px;
    border:1px solid #d4af37;
    border-radius:8px;
    background:#fff8e7;
    display:none;
}

.resultat-personne{
    padding:8px;
    cursor:pointer;
    color:#004a99;
    font-weight:bold;
}

.resultat-personne:hover{
    background:#f5f5f5;
}

#tree{
    width:100%;
    height:900px;
}

/* SUPPRESSION RECHERCHE FAMILYTREE */

foreignObject{
    display:none !important;
}

.bft-search,
.bft-search-container,
.bft-search-box,
.bft-search-result,
.bft-search-results,
[data-search]{
    display:none !important;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>
</head>

<body>

<header>
<h1>Arbre généalogique</h1>
<p>Famille ANDREY de la Suisse vers la France</p>
</header>

<nav>
<a href="index.html">Accueil</a>
<a href="ancetres.html">Ancêtres</a>
<a href="arbre.html">Arbre</a>
<a href="armoiries.html">Armoiries</a>
<a href="chronologie.html">Chronologie</a>
<a href="contact.html">Contact</a>
</nav>

<div class="search-box">
<input
id="search"
type="text"
placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="resultats"></div>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY
</footer>

<script>

fetch("famille.json")

.then(response => response.json())

.then(data => {

    const nodes = data.map(personne => ({

        id: personne.id,

        fid: personne.fid || undefined,

        mid: personne.mid || undefined,

        name: personne.nom,

        title:
            (personne.naissance || "") +
            (personne.deces ? " - " + personne.deces : "")

    }));



    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding:{
                field_0:"name",
                field_1:"title"
            },

            toolbar:{
                zoom:true,
                fit:true,
                expandAll:true
            }

        }
    );

    tree.load(nodes);

    tree.fit();



    function normaliser(txt){

        return (txt || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");

    }

    const zone =
        document.getElementById("resultats");



    document
    .getElementById("search")
    .addEventListener("input",function(){

        const recherche =
            normaliser(this.value.trim());

        zone.innerHTML="";
        zone.style.display="none";

        if(!recherche){
            return;
        }

        const resultat =
            nodes.filter(personne =>
                normaliser(personne.name)
                .includes(recherche)
            );

        zone.style.display="block";

        if(resultat.length===0){

            zone.innerHTML =
                "<strong>Aucun résultat trouvé</strong>";

            return;
        }

        zone.innerHTML =
            "<strong>" +
            resultat.length +
            " résultat(s) trouvé(s)</strong><br><br>";

        resultat.forEach(personne => {

            zone.innerHTML +=
                '<div class="resultat-personne">' +
                personne.name +
                '</div>';

        });

    });

})

.catch(error => {

    console.error(error);

});

</script>

</body>
</html>
