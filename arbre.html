<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:90px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

header h1{
    margin:0;
    font-size:3.2em;
}

header p{
    font-size:1.25em;
}

nav{
    background:#3b2618;
    padding:12px;
    overflow-x:auto;
    white-space:nowrap;
    text-align:center;
}

nav a{
    color:#f7f2e8;
    text-decoration:none;
    margin:0 8px;
    font-weight:bold;
}

nav a:hover{
    color:#d4af37;
}

.search-box{
    max-width:700px;
    margin:25px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#tree{
    width:100%;
    height:900px;
    border-top:4px solid #d4af37;
}

footer{
    background:#2c1810;
    color:#f7f2e8;
    text-align:center;
    padding:25px;
}

</style>

</head>

<body>

<header>
<h1>Arbre généalogique</h1>
<p>Famille ANDREY de la Suisse vers la France</p>
</header>

<nav>
<a href="index.html">Accueil</a>
<a href="ancetres.html">Ancêtres</a>
<a href="arbre.html">Arbre</a>
<a href="armoiries.html">Armoiries</a>
<a href="chronologie.html">Chronologie</a>
<a href="contact.html">Contact</a>
<a href="documents.html">Documents</a>
<a href="photos.html">Photos</a>
<a href="localisation.html">Localisation</a>
<a href="patronyme.html">Patronyme</a>
<a href="sources.html">Sources</a>
</nav>

<div class="search-box">
<input
id="search"
type="text"
placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY - Site généalogique familial
</footer>

 <script>

fetch("famille.json")
.then(response => {
    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }
    return response.json();
})
.then(data => {

    const nodes = data.map(p => ({

        id: p.id,

        fid: p.fid && p.fid !== "null" ? p.fid : undefined,

        mid: p.mid && p.mid !== "null" ? p.mid : undefined,

        name: p.nom,

        titre:
            (p.naissance || "") +
            (p.deces ? " - " + p.deces : "")

    }));


    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "titre"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            enableSearch: false,
            searchFields: [],

            scaleInitial: FamilyTree.match.boundary

        }
    );

    tree.load(nodes);


    function normalizeText(str) {
        return str
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }


    document.getElementById("search")
    .addEventListener("input", function () {

        const recherche = normalizeText(this.value.trim());

        if (!recherche) {
            return;
        }

        const personne = nodes.find(node =>
            normalizeText(node.name).includes(recherche)
        );

        if (personne) {

            tree.select(personne.id);

            const nodeElement =
                document.querySelector(
                    '[data-n-id="' + personne.id + '"]'
                );

            if (nodeElement) {

                nodeElement.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                    inline: "center"
                });

            }

            console.log("Trouvé :", personne.name);

        }

    });

})
.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:40px;color:red;text-align:center'>" +
        error.message +
        "</div>";

});

</script>
</body>
</html>
