<script>

fetch("famille.json")

.then(response => {

    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }

    return response.json();

})

.then(data => {

    const nodes = data.map(personne => ({

        id: personne.id,

        fid: personne.fid || undefined,

        mid: personne.mid || undefined,

        name: personne.nom,

        naissance: personne.naissance || "",

        deces: personne.deces || "",

        title:
            (personne.naissance || "") +
            (personne.deces ? " - " + personne.deces : "")

    }));



    const tree = new FamilyTree(
        document.getElementById("tree"),
        {

            enableSearch: false,

            searchFields: [],

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            },

            nodeBinding: {
                field_0: "name",
                field_1: "title"
            },

            scaleInitial: FamilyTree.match.boundary

        }
    );



    tree.load(nodes);

    tree.fit();



    setInterval(() => {

        document.querySelectorAll(
            ".bft-search," +
            ".bft-search-holder," +
            ".bft-search-container," +
            ".bft-search-box," +
            ".bft-search-results," +
            ".bft-search-result," +
            ".bft-toolbar-search"
        ).forEach(e => e.remove());



        document
        .querySelectorAll("#tree text")
        .forEach(el => {

            const txt =
                (el.textContent || "").trim();

            if(
                txt === "Search" ||
                txt.includes("type ?") ||
                txt.includes("help")
            ){
                el.remove();
            }

        });

    },500);




    function normaliser(txt){

        return (txt || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");

    }



    const zone =
        document.getElementById("resultats");



    document
    .getElementById("search")
    .addEventListener("input", function(){

        const recherche =
            normaliser(this.value.trim());

        zone.innerHTML = "";
        zone.style.display = "none";

        if(!recherche){
            return;
        }

        const resultat =
            nodes.filter(personne =>
                normaliser(personne.name)
                    .includes(recherche)
            );

        zone.style.display = "block";

        if(resultat.length === 0){

            zone.innerHTML =
                "<strong>Aucun résultat trouvé</strong>";

            return;

        }

        zone.innerHTML =
            "<strong>" +
            resultat.length +
            " résultat(s) trouvé(s)</strong><br><br>";



        resultat.forEach(personne => {

            const ligne =
                document.createElement("div");

            ligne.className =
                "resultat-personne";

            ligne.textContent =
                personne.name;



            ligne.onclick = function(){

                const noeud =
                    document.querySelector(
                        '[data-n-id="' +
                        personne.id +
                        '"]'
                    );

                if(!noeud){
                    return;
                }

                zone.style.display = "none";

                noeud.scrollIntoView({
                    behavior:"smooth",
                    block:"center",
                    inline:"center"
                });



                const rect =
                    noeud.querySelector("rect");

                if(rect){

                    const ancienStroke =
                        rect.getAttribute("stroke");

                    const ancienneLargeur =
                        rect.getAttribute("stroke-width");

                    rect.setAttribute(
                        "stroke",
                        "#d4af37"
                    );

                    rect.setAttribute(
                        "stroke-width",
                        "5"
                    );

                    setTimeout(() => {

                        rect.setAttribute(
                            "stroke",
                            ancienStroke || "#aeaeae"
                        );

                        rect.setAttribute(
                            "stroke-width",
                            ancienneLargeur || "1"
                        );

                    },3000);

                }

            };



            zone.appendChild(ligne);

        });

    });

})

.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:30px;color:red;text-align:center'>" +
        error.message +
        "</div>";

});

</script>
