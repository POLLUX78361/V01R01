<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbre généalogique - Famille ANDREY</title>

<script src="https://balkan.app/js/FamilyTree.js"></script>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#fdfbf7;
    color:#3d342d;
}

header{
    background:linear-gradient(135deg,#2c1810,#5a3e2b);
    color:#f7f2e8;
    text-align:center;
    padding:60px 20px;
}

.search-box{
    max-width:700px;
    margin:20px auto;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:1px solid #d4af37;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

#resultats{
    max-width:700px;
    margin:10px auto;
    padding:10px;
    display:none;
    background:#fff8e7;
    border:1px solid #d4af37;
    border-radius:8px;
}

#tree{
    width:100%;
    height:900px;
}

footer{
    background:#2c1810;
    color:#fff;
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<header>
    <h1>Arbre généalogique</h1>
    <p>Famille ANDREY</p>
</header>

<div class="search-box">
    <input
        id="search"
        type="text"
        placeholder="🔍 Rechercher un nom ou prénom...">
</div>

<div id="resultats"></div>

<div id="tree"></div>

<footer>
© 2026 Famille ANDREY
</footer>

<script>

fetch("famille.json")
.then(response => {

    if (!response.ok) {
        throw new Error("Impossible de charger famille.json");
    }

    return response.json();

})
.then(data => {

    const nodes = data.map(p => ({

        id: p.id,

        fid: p.fid && p.fid !== "null"
            ? p.fid
            : undefined,

        mid: p.mid && p.mid !== "null"
            ? p.mid
            : undefined,

        name: p.nom,

        titre:
            (p.naissance || "") +
            (p.deces ? " - " + p.deces : "")

    }));


    var tree = new FamilyTree(
        document.getElementById("tree"),
        {

            nodeBinding: {
                field_0: "name",
                field_1: "titre"
            },

            toolbar: {
                zoom: true,
                fit: true,
                expandAll: true
            }

        }
    );

    tree.load(nodes);


    function normaliser(texte){

        return (texte || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"");

    }


    const resultatsDiv =
        document.getElementById("resultats");

    document.getElementById("search")
    .addEventListener("input", function(){

        const recherche =
            normaliser(this.value.trim());

        resultatsDiv.innerHTML = "";
        resultatsDiv.style.display = "none";

        if(recherche === ""){
            return;
        }

        const resultats = nodes.filter(personne =>
            normaliser(personne.name)
                .includes(recherche)
        );

        resultatsDiv.style.display = "block";

        if(resultats.length === 0){

            resultatsDiv.innerHTML =
                "<strong>Aucun résultat trouvé</strong>";

            return;
        }

        resultatsDiv.innerHTML =
            "<strong>" +
            resultats.length +
            " résultat(s) trouvé(s)</strong><br><br>";

        resultats.forEach(personne => {

            resultatsDiv.innerHTML +=
                "• " + personne.name + "<br>";

        });

    });

})
.catch(error => {

    console.error(error);

    document.getElementById("tree").innerHTML =
        "<div style='padding:25px;color:red;text-align:center'>" +
        error.message +
        "</div>";

});

</script>

</body>
</html>
