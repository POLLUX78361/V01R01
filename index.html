<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Famille ANDREY</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/treant-js@1.0.0/Treant.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

#tree{
    width:100%;
    height:100vh;
    overflow:auto;
}

.node{
    padding:8px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
    min-width:200px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.node .title{
    font-weight:bold;
    color:#1f2937;
    font-size:14px;
}

.node .date{
    color:#666;
    font-size:12px;
}
</style>
</head>

<body>

<div id="tree"></div>

<script src="https://cdn.jsdelivr.net/npm/raphael@2.3.0/raphael.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/treant-js@1.0.0/Treant.min.js"></script>

<script>

fetch("famille.json")
.then(response => response.json())
.then(data => {

    const persons = {};
    let root = null;

    data.forEach(person => {

        persons[person.id] = {
            text: {
                name: person.name || person.nom || "Inconnu",
                title:
                    (person.birth || person.naissance || "") +
                    ((person.death || person.deces) ?
                    " - " + (person.death || person.deces) : "")
            },
            children: []
        };

    });

    data.forEach(person => {

        let parentId =
            person.pid ||
            person.fid ||
            person.parentId;

        if(parentId && persons[parentId]) {

            persons[parentId]
                .children
                .push(persons[person.id]);

        } else {

            root = persons[person.id];
        }

    });

    const config = {

        chart: {
            container: "#tree",
            rootOrientation: "WEST",
            levelSeparation: 50,
            siblingSeparation: 30,
            subTeeSeparation: 30,
            connectors: {
                type: "step"
            },
            animateOnInit: true,
            scrollbar: "native"
        },

        nodeStructure: root

    };

    new Treant(config);

})
.catch(err => {
    console.error(err);
    document.getElementById("tree").innerHTML =
        "<h2>Erreur de chargement du fichier famille.json</h2>";
});

</script>

</body>
</html>
